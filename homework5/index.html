<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Network</title>
<link rel="stylesheet" href="social-network.css">
</head>

<body>

<div class="leftbar">

    <div class="logo">
        Social Network
    </div>

    <div class="nav">
        <a href=""><img src="/fourthlesson/social_network/assets/icons/main.svg"></a>
        <a href=""><img src="/fourthlesson/social_network/assets/icons/friends.svg"></a>
        <a href=""><img src="/fourthlesson/social_network/assets/icons/saved.svg"></a>
        <a href=""><img src="/fourthlesson/social_network/assets/icons/settings.svg"></a>
    </div>

    <div class="out">
        <img src="/fourthlesson/social_network/assets/icons/out.svg">
    </div>

</div>



<div class="main">

    <div class="main-header">

        <div class="search">
            <input type="search" placeholder="Search">
        </div>

        <div class="main-header-icons">
            <img src="/fourthlesson/social_network/assets/icons/chat.svg">
            <img src="/fourthlesson/social_network/assets/icons/notification.svg">
        </div>

    </div>

    <div class="title">
        Feed
    </div>


    <div class="main-content">

        <div class="post-info">

            <div class="post-user">
                <img src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg">
                <h1>Eduard Shavinskiy</h1>
            </div>

            <div class="post-icons">
                <img src="/fourthlesson/social_network/assets/icons/saved.svg">
                <img src="/fourthlesson/social_network/assets/icons/more.svg">
            </div>

        </div>


        <div class="post-image">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470">
        </div>


        <div class="post-footer">

            <div class="post-description">
                <h1>Beautiful mountains landscape</h1>
            </div>

            <div class="post-reactions">

                <div class="post-reactions-icons">
                    <img src="/fourthlesson/social_network/assets/icons/like.svg">
                    <img src="/fourthlesson/social_network/assets/icons/comment.svg">
                    <img src="/fourthlesson/social_network/assets/icons/share.svg">
                </div>

                <div class="created_at">
                    <p>14:01 - 19.02.2026</p>
                </div>

            </div>

        </div>

    </div>

</div>



<div class="rightbar">

    <div class="user">

        <div class="avatar">
            <img src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg">
        </div>

        <div class="avatar-info">
            <h1>Eduard Shavinskiy</h1>
            <p>ubicza228</p>
        </div>

    </div>


    <div class="friends">

        <div class="friend">

            <div class="friend-avatar">
                <img src="https://img.freepik.com/free-photo/young-bearded-man-with-striped-shirt_273609-5677.jpg">
            </div>

            <div class="friend-info">
                <h1>Alex Tim</h1>
                <p>alex96</p>
            </div>

            <div class="friend-chat">
                <img src="/fourthlesson/social_network/assets/icons/chat.svg">
            </div>

        </div>

        <div class="friend">

            <div class="friend-avatar">
                <img src="https://img.freepik.com/free-photo/young-bearded-man-with-striped-shirt_273609-5677.jpg">
            </div>

            <div class="friend-info">
                <h1>Alex Tim</h1>
                <p>alex96</p>
            </div>

            <div class="friend-chat">
                <img src="/fourthlesson/social_network/assets/icons/chat.svg">
            </div>

        </div>

    </div>

</div>

</body>
</html>
