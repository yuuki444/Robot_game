
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личная визитка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Моя личная визитка</h1>

    <h2>Обо мне</h2>
    <h3>Немного информации</h3>
    <p>Меня зовут Мансур.Учусь в шаге</p>

    <img src="" alt="Мое фото">

    <h2>Мои контакты</h2>
    <p>
        Это мое имя
        <a href="https://ru.wikipedia.org/wiki/%D0%9C%D0%B0%D0%BD%D1%81%D1%83%D1%80"_blank">Мансур</a>
    </p>

    <button>Связаться со мной</button>

    <h2>Форма обратной связи</h2>

    <form>
        <label>
            Имя:
            <input type="text">
        </label>
        <br><br>

        <label>
            Это почта
            <input type="email">
        </label>
        <br><br>

        <label>
            Любимая цифра:
            <input type="number">
        </label>
        <br><br>

        <label>
            Дата рождения:
            <input type="date">
        </label>
        <br><br>

        <label>
            Это просто галочка, если вам понравился мой сайт!!!:
            <input type="checkbox" name="agree">
        </label>
        <br><br>

        <label>
            Любимый цвет:
            <input type="color" name="color">
        </label>
    </form>

</body>
</html>
