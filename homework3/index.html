<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Моя корзина</h1>

    <div class="products">

        <div class="card">
            <img src="" alt="Смартфон">
            <div class="card-content">
                <h3>Смартфон</h3>
                <p>Хороший за цену.</p>
                <div class="price">299 990 ₸</div>
            </div>
        </div>

        <div class="card">
            <img src="" alt="Ноутбук">
            <div class="card-content">
                <h3>Ноутбук</h3>
                <p>Быстрый и легкий.</p>
                <div class="price">499 990 ₸</div>
            </div>
        </div>

        <div class="card">
            <img src="" alt="Наушники">
            <div class="card-content">
                <h3>Наушники</h3>
                <p>Чистый звук и шумоподавление.</p>
                <div class="price">79 990 ₸</div>
            </div>
        </div>

    </div>

</body>
</html>
